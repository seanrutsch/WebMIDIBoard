name: Feature request
description: Suggest a new feature or improvement for WebMIDIBoard
labels: [enhancement]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Clearly describe the feature you would like.
    validations:
      required: true
  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: What problem does it solve? Who benefits, and how?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any other ways you have seen or tried to achieve this.
