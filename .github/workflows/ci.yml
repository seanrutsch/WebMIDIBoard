name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint docs and workflows
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Lint Markdown (markdownlint)
        run: npx --yes markdownlint-cli2@latest "**/*.md"

      - name: Lint workflows (actionlint)
        run: |
          set -euo pipefail
          version=1.7.12
          curl -sSfL "https://github.com/rhysd/actionlint/releases/download/v${version}/actionlint_${version}_linux_amd64.tar.gz" -o /tmp/actionlint.tgz
          mkdir -p "${HOME}/bin"
          tar -xzf /tmp/actionlint.tgz -C "${HOME}/bin" actionlint
          # No target argument on purpose: v1.7.x rejects directory paths; with no args
          # actionlint auto-detects the nearest .github/workflows directory (repo root in CI).
          "${HOME}/bin/actionlint" --color

      # TODO: add a build/test job here once the application toolchain lands.
